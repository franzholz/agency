services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false
  JambageCom\Agency\:
    resource: '../Classes/'
    exclude: '../Classes/{Hooks,Middleware,EventListener}/*,../Classes/Api/CustomerNumber.php'

  JambageCom\Agency\EventListener\PageContentPreviewRenderingListener:
    tags:
      - name: event.listener
        identifier: 'agencyCodeListener'
        event: TYPO3\CMS\Backend\View\Event\PageContentPreviewRenderingEvent
